# Publica a pasta web/ (versão stlite do painel) no GitHub Pages a cada push na main/master.
# Ativar uma vez no GitHub: Settings → Pages → Source: "GitHub Actions".
name: Publicar painel no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
